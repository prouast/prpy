[build-system]
# numpy capped at <2.3: 2.3.0 dropped manylinux2014/manylinux_2_17 wheels for
# cp312, so an open floor here makes cibuildwheel's cp312 job try to build
# newest-numpy from source in the manylinux2014 container and fail (its GCC
# 10.2.1 is below numpy's own >=10.3 build requirement). This only pins what
# prpy is compiled against, not prpy's own runtime numpy floor (see
# [project.dependencies] below).
requires = ["setuptools>=61", "setuptools-scm", "numpy>=2.0.0,<2.3"]
build-backend = "setuptools.build_meta"

[project]
name = "prpy"
authors = [
    {name = "Philipp Rouast", email = "philipp@rouast.com"},
]
description = "Collection of Python utils for signal, image, and video processing"
readme = "README.md"
# Upper bound must match the newest version actually tested (main.yml's
# matrix) and built (release.yml's CIBW_BUILD) - keep all three in sync
# when adding/dropping a Python version. Without this ceiling, pip will
# silently attempt an untested sdist build on any newer Python.
requires-python = ">=3.10,<3.13"
keywords = ["python", "numpy", "ffmpeg", "tensorflow", "torch"]
license = {text = "MIT License"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "numpy>=1.24",
    "vitallens-core>=0.2.3"
]
dynamic = ["version"]

[project.optional-dependencies]
ffmpeg = ["ffmpeg-python"]
numpy = ["scipy", "Pillow", "opencv-python", "psutil", "scikit-learn"]
numpy_min = ["scipy", "Pillow", "psutil"]
tensorflow = ["tensorflow>2.17.0"]
torch = ["torch>=2.1.0"]
test = ["pytest", "flake8", "psutil"]

[project.urls]
Repository = "https://github.com/prouast/prpy.git"
Issues = "https://github.com/prouast/prpy/issues"

[tool.setuptools]
packages = ["prpy"]

[tool.setuptools_scm]

[tool.pytest.ini_options]
markers = [
    "skip_parametrize_tf_cv2: skip tests that parametrize 'tf' or 'cv2'",
]
